name: GitHub Actions

on:
  pull_request:
    branches:
      - "master"
      - "dev"

# Только чтение
permissions:
  contents: read

jobs:
  # Прогоняем проект на поиск уязвимостей - Snyk (Checking only high)
  snyk-security:
    # Запускаем Snyk только для веток из основного репозитория
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/php@9adf32b1121593767fc3c057af55b55db032dc04 # v1.0.0
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high

  # Собираем проект и прогоняем тестами
  Tests:
    runs-on: ubuntu-22.04
    # Одноразовые значения только для CI 
    env:
      CI_DB_NAME: dev_eft
      CI_DB_TEST_NAME: test_migrations_db
      CI_DB_USER: prod_user
      CI_DB_PASSWORD: ci_password
      CI_DB_HOST: db
      CI_REDIS_HOST: redis
    steps:
      - uses: actions/checkout@v4
        with:
          # Не сохраняем токен в .git/config
          persist-credentials: false

      # Настройка Docker и кеширования
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ hashFiles('docker/php/Dockerfile') }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Install Docker and Docker Compose
        run: |
          sudo apt-get update
          sudo apt-get install docker-compose -y

      # Кеширование Composer
      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor/
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      # Формируем .env для CI из одноразовых значений задачи (см. env у задачи Tests) + пара заглушек
      - name: Set up environment variables
        run: |
          cat << EOF > .env
          DB_NAME="$CI_DB_NAME"
          DB_USER="$CI_DB_USER"
          DB_PASSWORD="$CI_DB_PASSWORD"
          DB_DSN="mysql:host=$CI_DB_HOST;dbname=$CI_DB_NAME"
          DB_CHARSET=utf8
          DB_TEST_NAME="$CI_DB_TEST_NAME"
          DB_TEST_USER="$CI_DB_USER"
          DB_TEST_PASSWORD="$CI_DB_PASSWORD"
          DB_TEST_DSN="mysql:host=$CI_DB_HOST;dbname=$CI_DB_TEST_NAME"
          DB_TEST_CHARSET=utf8
          REDIS_HOST="$CI_REDIS_HOST"
          DOMAIN=localhost
          DOMAIN_PROTOCOL=http://
          PROBLEM_URLS=test1,test2,test
          PROBLEM_NAMES=test_value
          COOKIE_VALIDATION_KEY="$(openssl rand -hex 32)"
          DEBUG_STATUS=true
          ENVIRONMENT=dev
          EOF

      # Проверка состояния кеша перед сборкой
      - name: Check Docker cache before build
        run: |
          echo -e "\033[1;34m🔍 Checking Docker cache state...\033[0m"
          ls -la /tmp/.buildx-cache || echo -e "\033[1;33m⚠️ Cache directory is empty\033[0m"
          echo -e "\033[1;34m📊 Cache size: \033[1;32m$(du -sh /tmp/.buildx-cache 2>/dev/null || echo '0')\033[0m"

      # Сборка и запуск контейнеров
      - name: Build containers
        run: |
          echo -e "\033[1;34m🏗️ Starting Docker build with cache...\033[0m"
          DOCKER_BUILDKIT=1 docker-compose build \
            --cache-from type=local,src=/tmp/.buildx-cache \
            --cache-to type=local,dest=/tmp/.buildx-cache-new \
            --progress=plain
          echo -e "\033[1;32m✅ Build completed\033[0m"

      - name: Start containers
        run: docker-compose up -d

      # Установка зависимостей
      - name: Install Composer dependencies
        run: docker-compose exec -T app composer install --no-interaction --ignore-platform-reqs --prefer-dist --optimize-autoloader

      # Настройка базы данных
      - name: Configure database
        run: |
          echo -e "\033[1;34m⏳ Waiting for MySQL to be ready...\033[0m"
          ready=0
          for i in {1..30}; do
            if docker exec tarkov_db mysqladmin ping -h"localhost" -P"3306" -u"root" -p"$CI_DB_PASSWORD" --silent; then
              echo -e "\033[1;32m✅ MySQL is ready!\033[0m"
              ready=1
              break
            fi
            echo -e "\033[1;33m⏳ Waiting for MySQL to be ready... attempt $i/30\033[0m"
            sleep 2
          done

          # Если БД так и не поднялась - сразу падаем с понятной ошибкой и логом контейнера
          if [ "$ready" -ne 1 ]; then
            echo "::error::MariaDB не запустилась за 60 секунд"
            docker logs tarkov_db --tail 50
            exit 1
          fi

          echo -e "\033[1;34m⚙️ Configuring database...\033[0m"
          docker exec tarkov_db mysql -h"localhost" -P"3306" -u"root" -p"$CI_DB_PASSWORD" --execute "
            CREATE DATABASE IF NOT EXISTS $CI_DB_TEST_NAME;
            GRANT SUPER ON *.* to '$CI_DB_USER'@'%' WITH GRANT OPTION;
            GRANT ALL PRIVILEGES ON $CI_DB_NAME.* to '$CI_DB_USER'@'%' WITH GRANT OPTION;
            GRANT ALL PRIVILEGES ON $CI_DB_TEST_NAME.* to '$CI_DB_USER'@'%' WITH GRANT OPTION;"

      # Применение миграций
      - name: Run migrations
        run: |
          echo -e "\033[1;34m🔄 Running migrations...\033[0m"
          docker-compose exec -T app php yii migrate --interactive=0
          docker-compose exec -T app php yii migrate --db db_test --interactive=0
          echo -e "\033[1;32m✅ Migrations completed\033[0m"

      # Очистка кеша
      - name: Clear Redis cache
        run: |
          echo -e "\033[1;34m🧹 Clearing Redis cache...\033[0m"
          docker-compose exec -T redis redis-cli flushall
          echo -e "\033[1;32m✅ Redis cache cleared\033[0m"

      # Запуск тестов
      - name: Run tests
        run: |
          echo -e "\033[1;34m🔬 Running tests...\033[0m"
          docker-compose exec -T app vendor/bin/codecept run
          echo -e "\033[1;32m✅ Tests completed\033[0m"

      # Сохранение кеша докера
      - name: Save Docker cache
        run: |
          echo -e "\033[1;34m💾 Saving Docker cache...\033[0m"
          mkdir -p /tmp/.buildx-cache-new
          if [ -d "/tmp/.buildx-cache" ]; then
            echo -e "\033[1;33m🗑️ Removing old cache...\033[0m"
            rm -rf /tmp/.buildx-cache
          fi
          echo -e "\033[1;34m📦 Moving new cache...\033[0m"
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache
          echo -e "\033[1;32m📊 New cache size: $(du -sh /tmp/.buildx-cache 2>/dev/null || echo '0')\033[0m"