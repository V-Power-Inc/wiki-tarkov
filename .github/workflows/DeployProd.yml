name: Deploy on Prod

# Автодеплой на PROD - только ветка master.
# Безопасность: триггер push, а не pull_request(closed) - деплой запускается только по факту попадания
# кода в master (мерж делает владелец), а не по событию PR, которое может прийти из форка
on:
  push:
    branches:
      - "master"

# Безопасность: токену GITHUB_TOKEN права не нужны - деплой ходит на сервер по SSH
permissions: {}

# Не запускаем два деплоя одновременно
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  Deploy:
    if: false # Деплой временно отключен
    runs-on: ubuntu-latest
    # Секреты SSH лучше хранить в окружении production (Settings -> Environments) с ограничением на ветку master и, при желании, ручным подтверждением (Required reviewers)
    environment: production
    steps:
      - name: Deploy on Prod
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_USER: ${{ secrets.SSH_USER }}
          # `ssh-keyscan wiki-tarkov.ru`, проверенный вручную - защита от подмены хоста (MITM)
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 600 -D /dev/null ~/.ssh/id_ed25519
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          echo "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -o StrictHostKeyChecking=yes -i ~/.ssh/id_ed25519 "$SSH_USER"@wiki-tarkov.ru 'cd /var/www/wiki-tarkov/html && git pull origin-github master'
          rm -f ~/.ssh/id_ed25519
